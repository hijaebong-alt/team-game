<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>팀 게임 · 테마 선택</title>
<style>
:root{--bg:#0a0f24;--card:#141b3a;--tx:#f2f4ff;--mu:#9aa3c7;--bd:#2a3563;--pr:#5b8cff;box-sizing:border-box}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0%,#1a2766 0,#0a0f24 55%) fixed;color:var(--tx);font:16px/1.6 -apple-system,"Noto Sans KR","Malgun Gothic",sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:22px 18px 36px}
.title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:6px 0 2px}
.title h1{margin:0;font-size:40px;letter-spacing:1px}
.ver{color:var(--mu);font-size:18px}
.sub{color:var(--mu);margin:0 0 22px}
.label{font-size:18px;font-weight:700;margin:6px 0 10px;color:#cfd8ff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.title h1{font-size:32px}}
@media(max-width:420px){.grid{grid-template-columns:1fr}}
.theme{position:relative;border:2px solid transparent;border-radius:18px;padding:18px 16px;min-height:150px;color:#fff;text-align:left;cursor:pointer;font:inherit;transition:transform .15s,border-color .15s,box-shadow .15s;display:flex;flex-direction:column;justify-content:space-between}
.theme:hover,.theme:focus-visible{transform:translateY(-4px);box-shadow:0 10px 26px #0008;outline:none}
.theme.on{border-color:#fff}
.theme .em{font-size:44px;line-height:1}
.theme .tt{font-size:24px;font-weight:800;margin-top:8px}
.theme .ss{font-size:14px;color:#ffffffcc;margin-top:2px}
.theme .cnt{position:absolute;top:12px;right:12px;font-size:13px;background:#00000055;border-radius:99px;padding:2px 10px}
.empty{border:2px dashed var(--bd);border-radius:18px;min-height:150px;display:flex;align-items:center;justify-content:center;color:var(--mu);font-size:17px;flex-direction:column;gap:4px;background:#ffffff06}
.empty b{font-size:26px}
.panel{display:none;margin:20px 0;border-radius:18px;padding:20px;border:1px solid var(--bd);background:var(--card)}
.panel.show{display:block}
.panel h2{margin:0 0 4px;font-size:28px}
.panel p{margin:6px 0;color:#d5dcff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chips a{font-size:14px;padding:5px 12px;border-radius:99px;background:#ffffff14;border:1px solid var(--bd);color:var(--tx);text-decoration:none}
.chips a:hover{background:#ffffff26}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.btn{display:inline-block;padding:12px 20px;border-radius:12px;border:1px solid var(--bd);background:#ffffff10;color:var(--tx);text-decoration:none;font-size:17px;font-weight:600;cursor:pointer;font-family:inherit}
.btn.p{background:var(--pr);border-color:var(--pr);color:#fff}
.join{margin:26px 0 0;padding:16px;border:1px solid var(--bd);border-radius:16px;background:#ffffff08;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.join b{font-size:17px}
.join input{padding:11px 14px;font-size:18px;width:150px;border-radius:10px;border:1px solid var(--bd);background:#0a0f24;color:var(--tx);letter-spacing:4px;text-align:center}
.foot{margin-top:34px;padding-top:14px;border-top:2px solid var(--bd);color:var(--mu);font-size:15px;line-height:1.9}
.foot b{color:#cfd8ff}
</style></head><body><div class="wrap">

<div class="title"><h1>〈팀 게임〉</h1><span class="ver">v.1.0</span></div>
<p class="sub">스마트폰으로 함께 즐기는 팀 대항 게임 · 진행자는 PC, 참가자는 스마트폰으로 참여합니다</p>

<div class="label">테마 선택</div>
<div class="grid" id="grid"></div>
<div class="panel" id="panel"></div>

<div class="join">
 <b>🙋 참가자이신가요?</b>
 <span style="color:var(--mu)">진행자가 보여 주는 QR코드를 찍거나, 방 코드를 입력하세요.</span>
 <input id="cd" inputmode="numeric" maxlength="4" placeholder="방 코드">
 <a class="btn p" id="go" href="#">입장하기</a>
</div>

<div class="foot">
 <div><b>제작자</b> : 이재봉</div>
 <div><b>제작일시</b> : 2026. 11. 26.　<a href="manual.html" style="color:#9db7ff">📖 게임 설명서</a></div>
</div>
</div>

<script src="themes.js"></script>
<script>
/* 예전 QR코드(#r1234)로 이 주소에 들어온 참가자는 게임 화면으로 보냅니다 */
if(/^#r\d{4}$/.test(location.hash)){location.replace('game.html'+location.hash)}
const TH=window.THEMES||{},ORDER=window.THEME_ORDER||Object.keys(TH),NAMES=window.NAMES||{};
const SLOTS=6;                                              // 첫 화면에 보이는 칸 수 (남는 칸은 "준비 중")
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const grid=document.getElementById('grid'),panel=document.getElementById('panel');
if(!ORDER.length){grid.innerHTML='<div class="empty" style="grid-column:1/-1">테마 정보를 불러오지 못했습니다. themes.js 파일이 올라가 있는지 확인해 주세요.</div>'}
let html='';
ORDER.forEach(id=>{const t=TH[id];if(!t)return;
 html+='<button class="theme" data-id="'+esc(id)+'" style="background:linear-gradient(135deg,'+t.colors[0]+','+t.colors[1]+')">'
  +'<span class="cnt">게임 '+(t.games||[]).length+'종</span><span class="em">'+esc(t.emoji)+'</span><span><div class="tt">'+esc(t.title)+'</div><div class="ss">'+esc(t.sub||'')+'</div></span></button>'});
for(let i=ORDER.length;i<SLOTS;i++)html+='<div class="empty"><b>＋</b>준비 중</div>';
if(ORDER.length)grid.innerHTML=html;
function openTheme(id){
 const t=TH[id];if(!t)return;
 document.querySelectorAll('.theme').forEach(b=>b.classList.toggle('on',b.dataset.id===id));
 panel.style.background='linear-gradient(135deg,'+t.colors[0]+'cc,'+t.colors[1]+'cc),#141b3a';
 panel.innerHTML='<h2>'+esc(t.emoji)+' '+esc(t.title)+'</h2><p>'+esc(t.desc||'')+'</p>'
  +'<p style="color:#ffffffaa;font-size:14px;margin-top:10px">이 테마의 게임 '+(t.games||[]).length+'종 (이름을 누르면 설명서의 해당 게임으로 이동합니다)</p>'
  +'<div class="chips">'+(t.games||[]).map((g,i)=>'<a target="_blank" rel="noopener" href="manual.html?theme='+encodeURIComponent(id)+'#g-'+encodeURIComponent(g)+'">'+(i+1)+'. '+esc(NAMES[g]||g)+'</a>').join('')+'</div>'
  +'<div class="btns"><a class="btn p" href="game.html?theme='+encodeURIComponent(id)+'">▶ 이 테마로 시작하기 (진행자)</a>'
  +'<a class="btn" target="_blank" rel="noopener" href="manual.html?theme='+encodeURIComponent(id)+'">📖 이 테마 설명서</a></div>';
 panel.classList.add('show');
 if(panel.scrollIntoView)panel.scrollIntoView({behavior:'smooth',block:'nearest'});
}
grid.addEventListener('click',e=>{const b=e.target.closest('.theme');if(b)openTheme(b.dataset.id)});
/* 참가자 방 코드 입장 */
const cd=document.getElementById('cd'),go=document.getElementById('go');
const enter=()=>{const v=cd.value.trim();if(/^\d{4}$/.test(v))location.href='game.html#r'+v;else{cd.focus();cd.style.borderColor='#e24b4a'}};
go.addEventListener('click',e=>{e.preventDefault();enter()});
cd.addEventListener('keydown',e=>{if(e.key==='Enter')enter()});
</script></body></html>
